# Azure Profile Configuration for Spring PetClinic# Azure-specific configuration for Spring PetClinic

# This profile is activated when running on Azure App Service# This profile is activated when running on Azure App Service



# Database Configuration (PostgreSQL)# Database configuration - PostgreSQL on Azure

# Connection details are provided via environment variables from App Servicedatabase=postgres

spring.datasource.url=${SPRING_DATASOURCE_URL}spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/petclinic?sslmode=require}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME}spring.datasource.username=${POSTGRES_USER:petclinic}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}spring.datasource.password=${POSTGRES_PASS:petclinic}



# JPA/Hibernate Configuration# SQL initialization - always run for Azure deployments

spring.jpa.hibernate.ddl-auto=nonespring.sql.init.mode=always

spring.jpa.show-sql=false

# JPA Configuration

# Database Initializationspring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=alwaysspring.jpa.open-in-view=false

spring.sql.init.platform=postgresspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false

# Server Configuration

server.port=8080# Web Configuration

spring.thymeleaf.mode=HTML

# Actuator Endpoints (for health checks)spring.thymeleaf.cache=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.probes.enabled=true# Internationalization

management.health.livenessState.enabled=truespring.messages.basename=messages/messages

management.health.readinessState.enabled=true

# Actuator Configuration for Azure

# Application Insights (Azure Monitor)management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Connection string is provided via environment variablemanagement.endpoint.health.probes.enabled=true

# The Java agent will auto-configure using APPLICATIONINSIGHTS_CONNECTION_STRINGmanagement.endpoint.health.show-details=when-authorized

management.health.livenessState.enabled=true

# Logging Configurationmanagement.health.readinessState.enabled=true

logging.level.root=INFO

logging.level.org.springframework.samples.petclinic=INFO# Application Insights Configuration

logging.level.org.springframework.web=INFO# Connection string is set via APPLICATIONINSIGHTS_CONNECTION_STRING environment variable

logging.level.org.hibernate.SQL=DEBUG# No additional configuration needed - Azure Java agent handles instrumentation

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging Configuration for Azure

# Cache Configuration (same as default)logging.level.org.springframework=INFO

spring.cache.cache-names=vetslogging.level.org.springframework.samples.petclinic=INFO

spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=600slogging.level.org.hibernate.SQL=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Maximum time static resources should be cached (production setting)
spring.web.resources.cache.cachecontrol.max-age=7d

# Server Configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Connection pool settings for Azure PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Azure-specific optimizations
spring.datasource.hikari.leak-detection-threshold=60000
